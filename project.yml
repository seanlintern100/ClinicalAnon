name: Redactor
options:
  bundleIdPrefix: com.3bigthings
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en

settings:
  MARKETING_VERSION: 1.0
  CURRENT_PROJECT_VERSION: 1

targets:
  Redactor:
    type: application
    platform: macOS
    sources:
      - path: ClinicalAnon
        excludes:
          - "**/*.md"
          - "**/Tests"
          - "**/GLiNERBundle/**"
          # Full app entry point & views (legacy, not used)
          - ClinicalAnonApp.swift
          - Views/MainContentView.swift
          - Views/RedactPhaseView.swift
          - Views/ImprovePhaseView.swift
          - Views/RestorePhaseView.swift
          - Views/PasteBackPhaseView.swift
          - Views/PhaseIndicator.swift
          - Views/AnonymizationView.swift
          - Views/HelpModalView.swift
          - Views/HelpWindowController.swift
          - Views/Session/**
          - Views/Components/ActionBar.swift
          - Views/Components/StatusBar.swift
          - ViewModels/WorkflowViewModel.swift
          - ViewModels/ImprovePhaseState.swift
          - Views/TranscriptionSettingsView.swift
          - Views/LocalLLMSettingsView.swift
          - Views/AISettingsView.swift
          # Recording / live-session UI (not in Lite)
          - RedactorLite/HomeView.swift
          - RedactorLite/ClientSessionsView.swift
          - "RedactorLite/Recording/**"
          # Audio + session services (not needed without recording)
          - "Services/Audio/**"
          - "Services/Session/**"
          - "Services/AWS/**"
          - Services/AIAssistantService.swift
          - Services/SessionAssistantService.swift
          - Services/SessionAIService.swift
          - Services/LocalLLMService.swift
          - Services/ConversationContext.swift
          # Models tied to live sessions / AI / audio / transcription
          - Models/LiveSession.swift
          - "Models/SessionAssistant/**"
          - Models/AudioChunkReference.swift
          - Models/ChatMessage.swift
          - Models/TranscriptSegment.swift
          - Models/TranscriptionGap.swift
    resources:
      - path: ClinicalAnon/Resources/Fonts
      - path: ClinicalAnon/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Redactor
        PRODUCT_BUNDLE_IDENTIFIER: com.3bigthings.Redactor
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5N8GXZGSZ5
        CODE_SIGN_ENTITLEMENTS: Redactor.entitlements
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_EMIT_LOC_STRINGS: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "REDACTOR_LITE"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: true
    info:
      path: ClinicalAnon/RedactorLite/Info.plist
    scheme:
      gatherCoverageData: false
