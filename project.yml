name: Redactor
options:
  bundleIdPrefix: com.3bigthings
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en

packages:
  AWSSDKSwift:
    url: https://github.com/awslabs/aws-sdk-swift
    exactVersion: "1.0.40"
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.15.0"
  # SpeakerKit requires Argmax Pro SDK license - see https://www.argmaxinc.com/blog/speakerkit
  # Uncomment when license is obtained:
  # SpeakerKit:
  #   url: https://github.com/argmaxinc/SpeakerKit
  #   from: "1.0.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: "2.29.3"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.1.6"

settings:
  MARKETING_VERSION: 1.0
  CURRENT_PROJECT_VERSION: 1

targets:
  Redactor:
    type: application
    platform: macOS
    sources:
      - path: ClinicalAnon
        excludes:
          - "**/*.md"
          - "**/Tests"
          - "**/GLiNERBundle/**"
    dependencies:
      - package: AWSSDKSwift
        product: AWSBedrockRuntime
      - package: WhisperKit
      # - package: SpeakerKit  # Requires Argmax Pro SDK license
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Hub
    resources:
      - path: ClinicalAnon/Resources/Fonts
      - path: ClinicalAnon/Resources/Assets.xcassets
      - path: ClinicalAnon/Preview Content
    info:
      path: ClinicalAnon/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Redactor
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2025 3 Big Things. All rights reserved."
        NSPrincipalClass: NSApplication
        UIAppFonts:
          - Fonts/Lora-Regular.ttf
          - Fonts/Lora-Bold.ttf
          - Fonts/Lora-Italic.ttf
          - Fonts/SourceSans3-Regular.ttf
          - Fonts/SourceSans3-SemiBold.ttf
          - Fonts/SourceSans3-Bold.ttf
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        NSMicrophoneUsageDescription: "Redactor needs microphone access to record your voice during clinical sessions."
    settings:
      base:
        PRODUCT_NAME: Redactor
        PRODUCT_BUNDLE_IDENTIFIER: com.3bigthings.Redactor
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_PREVIEWS: true
        DEVELOPMENT_ASSET_PATHS: "\"ClinicalAnon/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5N8GXZGSZ5
        CODE_SIGN_ENTITLEMENTS: Redactor.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ClinicalAnon/Resources/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2025 3 Big Things. All rights reserved."
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MARKETING_VERSION: 1.0
        SWIFT_EMIT_LOC_STRINGS: true
        # C++17 required by abseil
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        # WebRTC Audio Processing library configuration
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/webrtc-audio-processing/include"
          - "$(PROJECT_DIR)/Vendor/webrtc-audio-processing/include/webrtc"
          - "/opt/homebrew/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/webrtc-audio-processing/lib"
          - "/opt/homebrew/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          # WebRTC audio processing libraries
          - "-lwebrtc-audio-processing-2"
          - "-lcommon_audio"
          - "-llibbase"
          - "-llibapi"
          - "-lsystem_wrappers"
          - "-llibpffft"
          - "-llibrnnoise"
          - "-llibfft"
          # Abseil libraries (WebRTC dependency)
          - "-labsl_base"
          - "-labsl_raw_logging_internal"
          - "-labsl_log_severity"
          - "-labsl_spinlock_wait"
          - "-labsl_synchronization"
          - "-labsl_graphcycles_internal"
          - "-labsl_kernel_timeout_internal"
          - "-labsl_malloc_internal"
          - "-labsl_time"
          - "-labsl_civil_time"
          - "-labsl_time_zone"
          - "-labsl_strings"
          - "-labsl_strings_internal"
          - "-labsl_int128"
          - "-labsl_throw_delegate"
          # System frameworks
          - "-framework CoreFoundation"
        # WebRTC macros for proper compilation
        OTHER_CPLUSPLUSFLAGS:
          - "$(inherited)"
          - "-std=c++17"
          - "-DWEBRTC_MAC"
          - "-DWEBRTC_POSIX"
          - "-DWEBRTC_APM_DEBUG_DUMP=0"
        # Bridging header for Objective-C++ to Swift
        SWIFT_OBJC_BRIDGING_HEADER: "ClinicalAnon/ClinicalAnon-Bridging-Header.h"
    scheme:
      testTargets:
        - RedactorTests
      gatherCoverageData: false

  RedactorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClinicalAnon/Tests
    dependencies:
      - target: Redactor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.3bigthings.RedactorTests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
