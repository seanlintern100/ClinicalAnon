name: Redactor
options:
  bundleIdPrefix: com.3bigthings
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.15.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.7.7"

settings:
  MARKETING_VERSION: 1.0
  CURRENT_PROJECT_VERSION: 1

targets:
  Redactor:
    type: application
    platform: macOS
    sources:
      - path: ClinicalAnon
        excludes:
          - "**/*.md"
          - "**/Tests"
          - "**/GLiNERBundle/**"
          # Full app entry point & views (legacy, not used)
          - ClinicalAnonApp.swift
          - Views/MainContentView.swift
          - Views/RedactPhaseView.swift
          - Views/ImprovePhaseView.swift
          - Views/RestorePhaseView.swift
          - Views/PasteBackPhaseView.swift
          - Views/PhaseIndicator.swift
          - Views/AnonymizationView.swift
          - Views/HelpModalView.swift
          - Views/HelpWindowController.swift
          - Views/Session/**
          - Views/Components/ActionBar.swift
          - Views/Components/StatusBar.swift
          - ViewModels/WorkflowViewModel.swift
          - ViewModels/ImprovePhaseState.swift
          - Views/TranscriptionSettingsView.swift
          - Views/LocalLLMSettingsView.swift
          - Views/AISettingsView.swift
          # AI assistant service (replaced by Cowork export)
          - Services/Session/SessionAssistantService.swift
          - Services/Session/SessionAIService.swift
          # Heavy services not needed
          - Services/LocalLLMService.swift
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
    resources:
      - path: ClinicalAnon/Resources/Fonts
      - path: ClinicalAnon/Resources/Assets.xcassets
      - path: ClinicalAnon/Resources/CopilotMCP
    settings:
      base:
        PRODUCT_NAME: Redactor
        PRODUCT_BUNDLE_IDENTIFIER: com.3bigthings.Redactor
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5N8GXZGSZ5
        CODE_SIGN_ENTITLEMENTS: Redactor.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Redactor needs microphone access to record your voice during clinical sessions."
        MARKETING_VERSION: 1.0
        SWIFT_EMIT_LOC_STRINGS: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "REDACTOR_LITE"
        # C++17 required by abseil (WebRTC dependency)
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        # WebRTC Audio Processing library configuration
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/webrtc-audio-processing/include"
          - "$(PROJECT_DIR)/Vendor/webrtc-audio-processing/include/webrtc"
          - "/opt/homebrew/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/webrtc-audio-processing/lib"
          - "/opt/homebrew/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          # WebRTC audio processing libraries
          - "-lwebrtc-audio-processing-2"
          - "-lcommon_audio"
          - "-llibbase"
          - "-llibapi"
          - "-lsystem_wrappers"
          - "-llibpffft"
          - "-llibrnnoise"
          - "-llibfft"
          # Abseil libraries (WebRTC dependency)
          - "-labsl_base"
          - "-labsl_raw_logging_internal"
          - "-labsl_log_severity"
          - "-labsl_spinlock_wait"
          - "-labsl_synchronization"
          - "-labsl_graphcycles_internal"
          - "-labsl_kernel_timeout_internal"
          - "-labsl_malloc_internal"
          - "-labsl_time"
          - "-labsl_civil_time"
          - "-labsl_time_zone"
          - "-labsl_strings"
          - "-labsl_strings_internal"
          - "-labsl_int128"
          - "-labsl_throw_delegate"
          # System frameworks
          - "-framework CoreFoundation"
        # WebRTC macros for proper compilation
        OTHER_CPLUSPLUSFLAGS:
          - "$(inherited)"
          - "-std=c++17"
          - "-DWEBRTC_MAC"
          - "-DWEBRTC_POSIX"
          - "-DWEBRTC_APM_DEBUG_DUMP=0"
        # Bridging header for Objective-C++ to Swift
        SWIFT_OBJC_BRIDGING_HEADER: "ClinicalAnon/ClinicalAnon-Bridging-Header.h"
    info:
      path: ClinicalAnon/RedactorLite/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.3bigthings.Redactor
            CFBundleURLSchemes:
              - redactor-lite
        NSMicrophoneUsageDescription: "Redactor needs microphone access to record your voice during clinical sessions."
    scheme:
      gatherCoverageData: false
